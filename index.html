<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENTER THE MANOSPHERE!!</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --hot-pink: #1e90ff;
    --bubblegum: #7cc4ff;
    --neon-cyan: #3ef2ff;
    --sunset: #4fb3ff;
    --night: #050b1a;
    --purple: #0d2a5c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--night);
    color: #fff;
    font-family: 'Righteous', sans-serif;
  }

  /* ---------- Sky + sunset ---------- */
  .sky {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 120%, #1e90ff99 0%, transparent 55%),
      linear-gradient(to bottom, #050b1a 0%, #0d2a5c 45%, #1a4a9a 62%, #1e90ff 70%, #050b1a 70.2%);
    z-index: 0;
  }

  .sun {
    position: fixed;
    left: 50%;
    bottom: 30%;
    width: min(60vw, 420px);
    aspect-ratio: 1;
    transform: translate(-50%, 50%);
    clip-path: inset(0 -100px 50% -100px);
    border-radius: 50%;
    background: linear-gradient(to bottom, #e6f3ff 0%, #7cc4ff 35%, #1e90ff 75%);
    box-shadow: 0 0 80px #1e90ff;
    opacity: 0.85;
    overflow: hidden;
    z-index: 1;
  }

  .sun::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 28%;
    bottom: 50%;
    background: repeating-linear-gradient(to bottom, transparent 0 10px, #0d2a5c 10px 15px);
  }

  /* ---------- Synthwave grid floor ---------- */
  .floor {
    position: fixed;
    left: -50%;
    right: -50%;
    bottom: 0;
    height: 30%;
    background:
      linear-gradient(to bottom, var(--night) 0%, transparent 25%),
      repeating-linear-gradient(to right, var(--hot-pink) 0 2px, transparent 2px 80px),
      repeating-linear-gradient(to bottom, var(--hot-pink) 0 2px, transparent 2px 50px);
    transform: perspective(300px) rotateX(60deg);
    transform-origin: top center;
    animation: floorMove 1s linear infinite;
    opacity: 0.8;
    z-index: 2;
  }

  @keyframes floorMove {
    from { background-position: 0 0, 0 0, 0 0; }
    to   { background-position: 0 0, 0 0, 0 50px; }
  }

  /* ---------- Disco ball ---------- */
  .ball-wrap {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 4;
    animation: swing 4s ease-in-out infinite alternate;
    transform-origin: top center;
  }

  @keyframes swing {
    from { transform: translateX(-50%) rotate(-4deg); }
    to   { transform: translateX(-50%) rotate(4deg); }
  }

  .string {
    width: 3px;
    height: clamp(20px, 6vh, 60px);
    background: linear-gradient(#999, #eee);
  }

  .ball {
    position: relative;
    width: clamp(90px, 18vmin, 170px);
    aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    background:
      radial-gradient(circle at 35% 30%, #ffffffee 0%, #ffffff55 12%, transparent 30%),
      repeating-linear-gradient(to right, #00000055 0 2px, transparent 2px 12px),
      repeating-linear-gradient(to bottom, #00000055 0 2px, transparent 2px 12px),
      conic-gradient(from 0deg, #c9c9d6, #ffffff, #8f8fa3, #d6ecff, #a7f6ff, #c9c9d6, #ffffff, #8f8fa3, #c9c9d6);
    background-size: auto, 12px 100%, 100% 12px, 100% 100%;
    box-shadow:
      inset -14px -18px 30px #00000088,
      inset 8px 8px 20px #ffffff55,
      0 0 40px #7cc4ffcc,
      0 0 90px #1e90ff88;
    animation: spinTiles 3s linear infinite;
  }

  @keyframes spinTiles {
    from { background-position: 0 0, 0 0, 0 0, 0 0; }
    to   { background-position: 0 0, 120px 0, 0 0, 0 0; }
  }

  .ball::after {
    content: "";
    position: absolute;
    inset: 0;
    background: conic-gradient(from 0deg, transparent 0 20deg, #ffffff99 25deg, transparent 30deg 140deg, #a7f6ffaa 145deg, transparent 150deg 260deg, #d6ecffaa 265deg, transparent 270deg);
    animation: glint 2s linear infinite;
    mix-blend-mode: screen;
  }

  @keyframes glint { to { transform: rotate(360deg); } }

  /* ---------- Light reflections ---------- */
  .lights {
    position: fixed;
    inset: -50%;
    z-index: 3;
    pointer-events: none;
    animation: lightsSpin 14s linear infinite;
  }

  @keyframes lightsSpin { to { transform: rotate(360deg); } }

  .spot {
    position: absolute;
    border-radius: 50%;
    filter: blur(1px);
    animation: twinkle 1.4s ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.25; }
    to   { opacity: 1; }
  }

  /* ---------- Headline ---------- */
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 16px;
    z-index: 5;
  }

  .tagline {
    font-family: 'Monoton', cursive;
    font-size: clamp(16px, 3.4vw, 34px);
    color: var(--neon-cyan);
    letter-spacing: 0.08em;
    text-shadow: 0 0 8px var(--neon-cyan), 0 0 22px #3ef2ff88;
    margin: clamp(80px, 22vh, 220px) 0 8px;
    animation: flicker 3s infinite;
  }

  @keyframes flicker {
    0%, 92%, 100% { opacity: 1; }
    93% { opacity: 0.3; }
    95% { opacity: 1; }
    97% { opacity: 0.5; }
  }

  h1 {
    margin: 0;
    font-family: 'Bungee', sans-serif;
    font-weight: 400;
    line-height: 0.95;
    font-size: clamp(30px, 9vw, 140px);
    font-style: italic;
    transform: skew(-8deg);
    background: linear-gradient(to bottom, #fff 0%, #d6ecff 30%, #7cc4ff 48%, #1e90ff 52%, #4fb3ff 100%);
    -webkit-background-clip: text;
            background-clip: text;
    color: transparent;
    -webkit-text-stroke: 2px #fff3;
    filter:
      drop-shadow(4px 4px 0 #0d2a5c)
      drop-shadow(8px 8px 0 #050b1a)
      drop-shadow(0 0 24px #1e90ffaa);
    animation: pump 0.6s ease-in-out infinite alternate;
  }

  h1 span { display: block; }

  @keyframes pump {
    from { transform: skew(-8deg) scale(1); }
    to   { transform: skew(-8deg) scale(1.04); }
  }

  .enter {
    display: inline-block;
    margin-top: clamp(24px, 5vh, 48px);
    padding: 14px 34px;
    font-family: 'Bungee', sans-serif;
    font-size: clamp(16px, 2.6vw, 24px);
    color: var(--night);
    text-decoration: none;
    background: linear-gradient(to bottom, #fff, var(--bubblegum) 40%, var(--hot-pink));
    border: 3px solid #fff;
    border-radius: 999px;
    box-shadow: 0 0 20px var(--hot-pink), 0 6px 0 var(--purple);
    transition: transform 0.12s, box-shadow 0.12s;
  }

  .enter:hover,
  .enter:focus-visible {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 0 36px var(--hot-pink), 0 9px 0 var(--purple);
    outline: none;
  }

  .enter:active { transform: translateY(3px); box-shadow: 0 0 20px var(--hot-pink), 0 2px 0 var(--purple); }


  /* ---------- Hero meme ---------- */
  .hero {
    position: fixed;
    left: 50%;
    top: clamp(16px, 6vh, 60px);
    transform: translateX(-50%);
    width: min(92vw, 780px);
    z-index: 5;
  }

  .hero-frame {
    position: relative;
    border: 3px solid #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 0 30px #1e90ffcc, 0 0 80px #1e90ff66;
  }

  .hero-frame img { display: block; width: 100%; height: auto; }

  .hero-title {
    position: absolute;
    left: 1.5%;
    top: 47%;
    width: 46%;
    margin: 0;
    font-family: 'Bungee', sans-serif;
    font-weight: 400;
    font-style: italic;
    line-height: 0.95;
    font-size: min(4.9vw, 44px);
    text-align: center;
    transform: rotate(-7deg);
    background: linear-gradient(to bottom, #fff 0%, #d6ecff 30%, #7cc4ff 48%, #1e90ff 52%, #4fb3ff 100%);
    -webkit-background-clip: text;
            background-clip: text;
    color: transparent;
    -webkit-text-stroke: 1px #fff6;
    filter: drop-shadow(3px 3px 0 #0d2a5c) drop-shadow(5px 5px 0 #050b1a) drop-shadow(0 0 14px #1e90ffcc);
    animation: heroPump 0.6s ease-in-out infinite alternate;
  }

  .hero-title span { display: block; }

  @keyframes heroPump {
    from { transform: rotate(-7deg) scale(1); }
    to   { transform: rotate(-7deg) scale(1.05); }
  }

  .hero .enter { display: table; margin: clamp(16px, 3vh, 28px) auto 0; }

  @media (max-width: 520px) {
    .hero { top: 14vh; }
    .hero-frame { border-width: 2px; border-radius: 10px; }
    .hero-title { top: 46%; left: 0; width: 50%; font-size: 4.3vw; -webkit-text-stroke: 0; filter: drop-shadow(2px 2px 0 #0d2a5c) drop-shadow(0 0 8px #1e90ffcc); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>

<div class="sky"></div>
<div class="sun"></div>
<div class="floor"></div>
<div class="lights" id="lights"></div>

<main class="hero">
  <div class="hero-frame">
    <img src="images/entry-meme.jpg" alt="A bearded cartoon king in a horned crown holds up his hand next to a golden staff">
    <h1 class="hero-title"><span>ENTER THE</span><span>MANOSPHERE!!</span></h1>
  </div>
  <a class="enter" href="home.html">ENTER →</a>
</main>

<script>
  // Scatter colored disco-ball reflections around the room
  const lights = document.getElementById('lights');
  const colors = ['#ffffff', '#7cc4ff', '#3ef2ff', '#ffe66d', '#1e90ff'];
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('div');
    s.className = 'spot';
    const size = 4 + Math.random() * 10;
    const c = colors[Math.floor(Math.random() * colors.length)];
    s.style.width = s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.background = c;
    s.style.boxShadow = `0 0 ${size * 2}px ${c}`;
    s.style.animationDelay = (Math.random() * 1.4) + 's';
    lights.appendChild(s);
  }
</script>

</body>
</html>
