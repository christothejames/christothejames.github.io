<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Shadow ranking</title>
<style>
  :root {
    --bg: #000;
    --panel: #070d07;
    --green: #00ff66;
    --dim: #4fa86a;
    --line: #00ff6633;
    --red: #ff4d4d;
    --gold: #ffe66d;
    --blue: #1e90ff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--green);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.45;
  }

  a { color: var(--green); }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 80px; }

  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: 0.04em; }
  h2 { font-size: 16px; margin: 30px 0 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }

  .sub { color: var(--dim); margin: 0 0 16px; }

  .bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 14px;
  }

  .bar button, .bar input {
    font: inherit;
    background: var(--panel);
    color: var(--green);
    border: 1px solid var(--line);
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
  }

  .bar input { cursor: text; flex: 1; min-width: 180px; }
  .bar button[aria-pressed="true"] { background: var(--green); color: #000; }

  .row {
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-bottom: 8px;
    background: var(--panel);
  }

  .row summary {
    display: grid;
    grid-template-columns: 34px 1fr 200px 64px 90px;
    gap: 10px;
    align-items: center;
    padding: 10px 12px;
    cursor: pointer;
    list-style: none;
  }

  .row summary::-webkit-details-marker { display: none; }

  .pos { color: var(--dim); text-align: right; }
  .nm { color: #eaffef; }
  .nm small { display: block; color: var(--dim); }
  .meter { height: 8px; background: #00ff6614; border-radius: 4px; overflow: hidden; }
  .meter span { display: block; height: 100%; background: var(--green); }
  .sc { font-size: 22px; text-align: right; }
  .raw { text-align: right; color: var(--dim); font-size: 12px; }

  .pill { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 3px; margin-left: 6px; vertical-align: 1px; }
  .pill.good { background: var(--gold); color: #000; }
  .pill.bad { background: var(--red); color: #000; }
  .pill.review { border: 1px dashed var(--dim); color: var(--dim); }
  .pill.composite { border: 1px dashed var(--blue); color: var(--blue); }

  .detail { padding: 0 12px 12px 56px; }
  .item { display: grid; grid-template-columns: 52px 70px 1fr; gap: 10px; padding: 4px 0; border-top: 1px dashed #00ff661a; }
  .item .p { text-align: right; }
  .item .p.neg { color: var(--red); }
  .item .d { color: var(--dim); }
  .item .t small { display: block; color: var(--dim); }
  .links { margin-top: 8px; }
  .pill.suggest { border: 1px solid var(--dim); color: var(--dim); }
  .pill.approved { background: var(--blue); color: #000; }
  .approve { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .approve button, .pending button {
    font: inherit; font-size: 13px; cursor: pointer; border-radius: 4px; padding: 6px 12px;
    background: var(--panel); color: var(--green); border: 1px solid var(--line);
  }
  .approve button.good { border-color: var(--gold); color: var(--gold); }
  .approve button.bad { border-color: var(--red); color: var(--red); }
  .approve button[aria-pressed="true"].good { background: var(--gold); color: #000; }
  .approve button[aria-pressed="true"].bad { background: var(--red); color: #000; }
  .pending { display: none; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; padding: 10px 12px; border: 1px solid var(--blue); border-radius: 6px; color: #eaffef; }
  .pending.on { display: flex; }
  .pending span { flex: 1; min-width: 200px; }
  .dims { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 6px 18px; margin: 4px 0 12px; }
  .dim { display: grid; grid-template-columns: 130px 1fr 66px; gap: 8px; align-items: center; font-size: 12px; }
  .dt { height: 6px; background: #00ff6614; border-radius: 3px; overflow: hidden; }
  .dt span { display: block; height: 100%; background: var(--green); }
  .dv { text-align: right; }

  table { width: 100%; border-collapse: collapse; }
  td { padding: 4px 8px; border-bottom: 1px dashed #00ff661a; }
  td.n { text-align: right; width: 60px; }
  td.n.neg { color: var(--red); }

  .rules { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }

  .locked { text-align: center; padding: 120px 16px; color: #888; font-family: system-ui, sans-serif; }

  @media (max-width: 720px) {
    .row summary { grid-template-columns: 26px 1fr 54px; }
    .row summary .meter, .row summary .raw { display: none; }
    .detail { padding-left: 12px; }
    .item { grid-template-columns: 44px 1fr; }
    .item .d { display: none; }
    .rules { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="data/people.js"></script>
<script src="data/shadow.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  try {
    if (q.get('shadow') === 'off') sessionStorage.removeItem('rmr_shadow');
    else if (q.has('shadow')) sessionStorage.setItem('rmr_shadow', '1');
  } catch {}
  let shadow = false;
  try { shadow = sessionStorage.getItem('rmr_shadow') === '1'; } catch { shadow = q.has('shadow'); }

  const app = document.getElementById('app');
  if (!shadow) {
    app.innerHTML = '<div class="locked">Nothing to see here.<br><br><a href="home.html" style="color:#888">← Back</a></div>';
    return;
  }

  const RULES = window.RULES;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
  const sign = n => (n > 0 ? '+' : '') + n;
  const people = window.PEOPLE;
  const dimBars = p => `<div class="dims">${window.DIMS.map(d => { const v = p.dimScore[d.key]; return `<div class="dim"><span>${d.label}</span><span class="dt"><span style="width:${v ?? 0}%"></span></span><span class="dv">${v == null ? 'no record' : v}</span></div>`; }).join('')}</div>`;

  app.innerHTML = `
    <div class="wrap">
      <h1>◼ SHADOW RANKING</h1>
      <p class="sub">Only visible in shadow mode on this device. ${people.filter(p => p.type !== 'composite').length} real men scored. Raw points scaled 0–100 (lowest = 0, highest = 100). <a href="home.html">← boards</a> · <a href="home.html?shadow=off">exit shadow mode</a></p>
      <div class="bar" role="group" aria-label="Filter">
        <input id="find" type="search" placeholder="filter by name…" aria-label="Filter by name">
        <button data-f="all" aria-pressed="true">all</button>
        <button data-f="review" aria-pressed="false">under review</button>
        <button data-f="good" aria-pressed="false">wanted</button>
        <button data-f="bad" aria-pressed="false">not wanted</button>
        <button data-f="composite" aria-pressed="false">composites</button>
      </div>
      <div class="pending" id="pending"></div>
      <div id="list"></div>
      <h2>RULES (edit weights in data/shadow.js)</h2>
      <div class="rules" id="rules"></div>
    </div>`;

  const ruleRows = Object.entries(RULES).sort((a, b) => b[1].pts - a[1].pts);
  const half = Math.ceil(ruleRows.length / 2);
  const table = rows => `<table>${rows.map(([k, r]) => `<tr><td class="n ${r.pts < 0 ? 'neg' : ''}">${sign(r.pts)}</td><td>${esc(r.label)}</td></tr>`).join('')}</table>`;
  document.getElementById('rules').innerHTML = table(ruleRows.slice(0, half)) + table(ruleRows.slice(half));

  // Approvals: picks are saved in this browser until they're published
  // (set list: in data/shadow.js and push). Suggested board = sign of raw points.
  const KEY = 'rmr_approvals';
  let picks = {};
  try { picks = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
  const review = () => people.filter(p => p.list === 'review' && p.type !== 'composite');
  // drop picks for men already published
  Object.keys(picks).forEach(id => { if (!review().some(p => p.id === id)) delete picks[id]; });
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(picks)); } catch {} };
  const suggest = p => p.raw >= 0 ? 'good' : 'bad';
  const board = l => l === 'good' ? 'Wanted' : 'Not Wanted';

  function renderPending() {
    const el = document.getElementById('pending');
    const ids = Object.keys(picks);
    const left = review().filter(p => !picks[p.id]);
    el.classList.toggle('on', ids.length > 0 || left.length > 0);
    el.innerHTML = `
      <span>${ids.length ? `<b>${ids.length} approved, not live yet.</b> Copy and send to Claude to publish.` : `${left.length} men under review.`}</span>
      ${left.length ? `<button id="all">approve all as suggested (${left.length})</button>` : ''}
      ${ids.length ? '<button id="copy">copy for Claude</button>' : ''}`;
    el.querySelector('#all')?.addEventListener('click', () => { left.forEach(p => { picks[p.id] = suggest(p); }); save(); render(); });
    el.querySelector('#copy')?.addEventListener('click', e => {
      const txt = 'Publish these shadow approvals:\n' + ids.map(id => `${id} → ${board(picks[id])}`).join('\n');
      const done = () => { e.target.textContent = 'copied ✓'; };
      navigator.clipboard?.writeText(txt).then(done, () => prompt('Copy this:', txt)) ?? prompt('Copy this:', txt);
    });
  }

  let filter = 'all';
  function render() {
    renderPending();
    const term = document.getElementById('find').value.trim().toLowerCase();
    const list = people
      .filter(p => filter === 'all' ? true : filter === 'composite' ? p.type === 'composite' : (p.list === filter && p.type !== 'composite'))
      .filter(p => !term || p.name.toLowerCase().includes(term))
      .sort((a, b) => b.raw - a.raw);
    document.getElementById('list').innerHTML = list.map((p, i) => {
      const tag = p.type === 'composite' ? '<span class="pill composite">composite · not scaled</span>'
        : `<span class="pill ${p.list}">${p.list === 'good' ? 'wanted' : p.list === 'bad' ? 'not wanted' : 'review'}</span>`
          + (p.list !== 'review' || p.type === 'composite' ? ''
            : picks[p.id] ? `<span class="pill approved">→ ${board(picks[p.id]).toLowerCase()}</span>`
            : `<span class="pill suggest">suggests ${board(suggest(p)).toLowerCase()}</span>`);
      const approve = p.list !== 'review' || p.type === 'composite' ? '' : `
          <div class="approve" data-id="${esc(p.id)}">
            <button class="good" data-pick="good" aria-pressed="${picks[p.id] === 'good'}">approve: Wanted</button>
            <button class="bad" data-pick="bad" aria-pressed="${picks[p.id] === 'bad'}">approve: Not Wanted</button>
          </div>`;
      return `
      <details class="row">
        <summary>
          <span class="pos">${i + 1}</span>
          <span class="nm">${esc(p.name)}${tag}<small>${esc(p.role || '')}</small></span>
          <span class="meter"><span style="width:${p.shadow}%"></span></span>
          <span class="sc">${p.type === 'composite' ? '–' : p.shadow}</span>
          <span class="raw">${sign(p.raw)} pts<br>+${p.plus} / ${p.minus}</span>
        </summary>
        <div class="detail">
          ${p.type === 'composite' ? '' : dimBars(p)}
          ${(p.points || []).slice().sort((a, b) => (RULES[b.rule]?.pts || 0) - (RULES[a.rule]?.pts || 0)).map(it => {
            const r = RULES[it.rule] || { pts: 0, label: it.rule };
            return `<div class="item">
              <span class="p ${r.pts < 0 ? 'neg' : ''}">${sign(r.pts)}</span>
              <span class="d">${esc(it.date || '')}</span>
              <span class="t">${esc(it.text)}<small>${esc(r.label)}${it.source ? ` · <a href="${esc(it.source)}" target="_blank" rel="noopener">${esc(host(it.source))}</a>` : ''}</small></span>
            </div>`;
          }).join('') || '<div class="item"><span></span><span></span><span class="t">No points yet.</span></div>'}
          <div class="links"><a href="profile.html?id=${encodeURIComponent(p.id)}">open profile →</a></div>${approve}
        </div>
      </details>`;
    }).join('') || '<p class="sub">Nobody matches.</p>';
  }

  // Click a pick to approve, click it again to undo. Keeps the row open.
  document.getElementById('list').addEventListener('click', e => {
    const b = e.target.closest('[data-pick]');
    if (!b) return;
    const id = b.parentElement.dataset.id;
    if (picks[id] === b.dataset.pick) delete picks[id]; else picks[id] = b.dataset.pick;
    save();
    render();
    document.querySelector(`.approve[data-id="${CSS.escape(id)}"]`)?.closest('details')?.setAttribute('open', '');
  });

  document.getElementById('find').addEventListener('input', render);
  document.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('[data-f]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    filter = b.dataset.f;
    render();
  }));
  render();
})();
</script>
</body>
</html>
